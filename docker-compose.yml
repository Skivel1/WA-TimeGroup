services:
  skibot:
    build: .
    image: skibot:latest
    # La imagen se construye localmente: evita que Portainer/compose intente bajar "skibot" de Docker Hub
    # (error "pull access denied for skibot") al usar Pull and redeploy / Re-pull image.
    pull_policy: build
    container_name: skibot
    restart: unless-stopped
    init: true               # evita procesos zombie de Chromium
    shm_size: '512mb'        # /dev/shm: Chromium se cae con el valor por defecto (64 MB)
    stop_grace_period: 20s   # tiempo para cerrar Chromium limpiamente
    environment:
      - OWNER_NUMBER=${OWNER_NUMBER}
      - ADMIN_NUMBERS=${ADMIN_NUMBERS:-}
      - OWNER_IDS=${OWNER_IDS:-}
      - PUBLIC_COMMANDS=${PUBLIC_COMMANDS:-false}
      - ALLOW_GROUP_ADMINS=${ALLOW_GROUP_ADMINS:-true}
      - ADMIN_IDS=${ADMIN_IDS:-}
      - BOT_NAME=${BOT_NAME:-Skibot}
      - TZ=${TZ:-America/Mexico_City}
      - LOG_MESSAGES=${LOG_MESSAGES:-false}
    volumes:
      - skibot_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  skibot_data:
