services:
  skibot:
    build: .
    image: skibot:latest
    container_name: skibot
    restart: unless-stopped
    init: true               # evita procesos zombie de Chromium
    shm_size: '512mb'        # /dev/shm: Chromium se cae con el valor por defecto (64 MB)
    stop_grace_period: 20s   # tiempo para cerrar Chromium limpiamente
    environment:
      - OWNER_NUMBER=${OWNER_NUMBER}
      - BOT_NAME=${BOT_NAME:-Skibot}
      - TZ=${TZ:-America/Mexico_City}
      - LOG_MESSAGES=${LOG_MESSAGES:-false}
    volumes:
      - skibot_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  skibot_data:
